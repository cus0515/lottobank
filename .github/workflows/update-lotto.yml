name: Update Lotto & Pension Cache

on:
  schedule:
    # 로또 6/45 — 토요일 20:35~21:30 KST (= UTC 11:35~12:30)
    - cron: '35 11 * * 6'
    - cron: '40 11 * * 6'
    - cron: '45 11 * * 6'
    - cron: '50 11 * * 6'
    - cron: '55 11 * * 6'
    - cron: '0 12 * * 6'
    - cron: '5 12 * * 6'
    - cron: '10 12 * * 6'
    - cron: '15 12 * * 6'
    - cron: '20 12 * * 6'
    - cron: '25 12 * * 6'
    - cron: '30 12 * * 6'
    # 연금복권 720+ — 목요일 20:35~21:30 KST (= UTC 11:35~12:30)
    - cron: '35 11 * * 4'
    - cron: '40 11 * * 4'
    - cron: '45 11 * * 4'
    - cron: '50 11 * * 4'
    - cron: '55 11 * * 4'
    - cron: '0 12 * * 4'
    - cron: '5 12 * * 4'
    - cron: '10 12 * * 4'
    - cron: '15 12 * * 4'
    - cron: '20 12 * * 4'
    - cron: '25 12 * * 4'
    - cron: '30 12 * * 4'
    # 평일 매일 21:00 KST — 혹시 놓친 회차 보완 (로또/연금 둘 다 시도)
    - cron: '0 12 * * 0,1,2,3,5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest lotto result
        run: python3 scripts/fetch_lotto.py

      - name: Fetch latest pension result
        run: python3 scripts/fetch_pension.py

      - name: Auto-post community news (회차 결과 소식 게시판)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate_news_post.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotto-cache.json lotto-history.json pension-cache.json pension-history.json lotto-news-state.json pension-news-state.json site-recommendations.json sitemap.xml sitemap.txt news
          if git diff --staged --quiet; then
            echo "No changes — cache is already up to date"
          else
            git commit -m "chore: update lotto/pension cache $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
